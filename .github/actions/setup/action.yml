name: Setup
description: Install Node.js, pnpm and workspace dependencies, with the pnpm store and Turborepo caches restored.

inputs:
  node-version:
    description: Node.js version to install
    required: true
  pnpm-cache:
    description: Pass "pnpm" to cache the pnpm store. Worth it where a cold install is slow; not worth it in the container job, where install takes ~8s but saving the store takes ~28s.
    required: false
    default: pnpm

runs:
  using: composite
  steps:
    # install pnpm first so actions/setup-node can locate the store to cache
    - uses: pnpm/action-setup@v5
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        # an empty cache value means "no caching", which is setup-node's default
        cache: ${{ inputs.pnpm-cache }}
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Turborepo reuses task output only when a task's inputs hash the same, so
    # this cache cannot go stale; it lets later runs skip rebuilds.
    - uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.node-version }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.node-version }}-
